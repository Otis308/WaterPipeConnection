<!doctype html><meta charset="utf-8"><title>Scoring DOM test</title>
<div class="KhungGame"></div><pre id="browserResult">RUNNING</pre>
<script>
  const fixture = {numPairs:1,mapSizeKey:'3x5',thinkingTimeMs:300000,cells:[],pipes:[{
    pairId:1,start:{r:2,c:1},end:{r:2,c:5},color:{hex:'#00e5ff',border:'1px solid blue',glow:'none'}
  }]};
  for(let r=1;r<=3;r++)for(let c=1;c<=5;c++)fixture.cells.push({r,c,file:'OngXanh/OngXanh-ChuThap.svg',initialRot:0});
  Object.assign(fixture.cells.find(c=>c.r===2&&c.c===1),{file:'OngBatDau.svg',initialRot:0,role:'start',pairId:1});
  Object.assign(fixture.cells.find(c=>c.r===2&&c.c===5),{file:'OngKetThuc.svg',initialRot:180,role:'end',pairId:1});
  fixture.cells.find(c=>c.r===2&&c.c===3).file='OngXanh/OngXanh-Thang.svg';
  const state={v:2,rotations:{},layout:{}};
  fixture.cells.forEach(c=>{const k=`${c.r}-${c.c}`;state.rotations[k]=c.initialRot;state.layout[k]=c;});
  sessionStorage.setItem('gameMode','pvp');sessionStorage.setItem('pvpRoomCode','DOM01');
  sessionStorage.setItem('pvpMatchData',JSON.stringify({room_code:'DOM01',map_data:fixture,players:[]}));
  window.HUIT_AUTH_USER={id:1};
  let version=0;const calls=[];const errors=[];
  window.addEventListener('error',e=>errors.push(e.message));
  function evaluation(){return {quality_score:version%2?100:44,official_score:version%2?100:44,is_optimal:!!(version%2),is_all_completed:true,score_status:'proven'};}
  window.fetch=async (url,options={})=>{
    let data={};
    if(url.includes('/reconnect')) data={player_snapshot:{board_state:{...state,scoring:evaluation()},board_state_version:0,
      solve_status:'playing',room_status:'in_progress',started_at_ts:Math.floor(Date.now()/1000),time_limit_seconds:300}};
    else if(url.includes('/match-status'))data={match_status:'in_progress',leaderboard:[]};
    else if(url.includes('/submit-')){
      const payload=JSON.parse(options.body);calls.push({url,...payload});
      if(payload.expected_version!==version)throw new Error('Unexpected version');
      if(payload.action){await new Promise(resolve=>setTimeout(resolve,100));version++;}
      data={evaluation:evaluation(),board_state_version:version,is_completed:url.includes('/submit-solution')};
    } else throw new Error('Unexpected network request '+url);
    return {ok:true,json:async()=>({success:true,data})};
  };
</script>
<script src="../public/JS/TrangGame/SVGnuoc.js"></script>
<script src="../public/JS/TrangGame/PipeScore.js"></script>
<script src="../public/JS/TrangGame/BanDoGame.js"></script>
<script src="../public/JS/TrangGame/CheDoAI.js"></script>
<script src="../public/JS/TrangGame/PvpActionQueue.js"></script>
<script src="../public/JS/TrangGame/PvpMatch.js"></script>
<script>
  document.addEventListener('DOMContentLoaded',async()=>{
    let checks=0;function check(c,m){checks++;if(!c)throw new Error(m);}
    try{
      for(let i=0;i<50&&window.pvpRestoring;i++)await new Promise(r=>setTimeout(r,20));
      const submit=document.getElementById('pvpSubmitSolution');
      check(!window.pvpRestoring&&!window.pvpSyncFailed,'Initial restore');
      check(window.diemHienTai100===44&&!window.isGameOver&&!submit.disabled,'Detour remains editable before explicit submit');
      const pipe=document.querySelector('[data-row="2"][data-col="3"] .AnhOngNuoc');
      pipe.click();await new Promise(r=>setTimeout(r,250));
      check(window.diemHienTai100===100&&!window.PvpMatch.getState().isCompleted&&!window.isGameOver,'100 is a playing score');
      pipe.click();submit.click();
      check(window.pvpSubmitting&&!window.PvpMatch.getState().isCompleted,'Submission waits for pending last action');
      await new Promise(r=>setTimeout(r,200));
      check(calls.at(-1).url.endsWith('/submit-solution')&&calls.at(-1).expected_version===2,'Last action precedes submission');
      check(window.PvpMatch.getState().isCompleted&&window.isGameOver&&window.diemHienTai100===44,'Server-accepted detour locks at actual score');
      check(errors.length===0,errors.join(';'));
      document.getElementById('browserResult').textContent=`PASS: ${checks} real DOM assertions (mock HTTP)`;
    }catch(error){document.getElementById('browserResult').textContent='FAIL: '+error.stack;}
  });
</script>
